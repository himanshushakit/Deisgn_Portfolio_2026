name: Deploy to GitHub Pages

# Vite + React static build, published to GitHub Pages via the Actions deployment flow (no gh-pages
# branch — the artifact is uploaded and deployed directly).
on:
  push:
    # Both branches build: `main` is the eventual mainline, `architecture-recovery` currently holds
    # the work. Drop the second entry once the branch is merged.
    branches: [main, architecture-recovery]
  # Lets a deployment be re-run from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write         # required to publish
  id-token: write      # required by deploy-pages for its OIDC token

# One deployment at a time. `cancel-in-progress: false` on purpose: cancelling a half-finished
# Pages deployment can leave the site in an inconsistent state, so queued runs wait instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` (not `npm install`) so the build is reproducible from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Sets the correct base path for a project Pages site. `${{ github.event.repository.name }}`
      # means this is derived from the repo itself rather than hardcoded — renaming the repo (the
      # name currently has a typo) can't silently break asset paths.
      # NOTE: if a custom domain is ever configured, change this to VITE_BASE=/ since a custom
      # domain serves from the root.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # Fail loudly here rather than shipping a site whose 3D scene silently 404s. The GLB is the
      # one asset the whole experience depends on, and it is the one most likely to be lost to a
      # base-path or publicDir mistake.
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/scene.glb  || { echo "::error::dist/scene.glb missing — public/ was not copied"; exit 1; }
          test -d dist/draco      || { echo "::error::dist/draco missing — GLB cannot be decompressed"; exit 1; }
          echo "Asset references in dist/index.html:"
          grep -o 'src="[^"]*"\|href="[^"]*"' dist/index.html || true
          echo "dist size: $(du -sh dist | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on with the 'GitHub Actions' source if it isn't configured yet, so this
          # works without anyone visiting the repo settings first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
